<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Hello, World — A little light on the web</title>
  <style>
    :root { color-scheme: dark; --ink:#f4f3ff; --muted:#aaaac4; --pink:#ff79c6; --cyan:#72e5ff; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100svh; display:grid; place-items:center; overflow:hidden; padding:24px; color:var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:radial-gradient(ellipse at 18% 15%,#25204d 0,transparent 38%),radial-gradient(ellipse at 85% 82%,#123b55 0,transparent 36%),#0b1020; }
    .stars { position:fixed; inset:0; pointer-events:none; opacity:.65; background-image:radial-gradient(1px 1px at 12% 24%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 76% 18%,#b7e9ff 99%,transparent),radial-gradient(1px 1px at 87% 63%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 23% 78%,#ffc7e7 99%,transparent),radial-gradient(1px 1px at 54% 91%,#fff 99%,transparent),radial-gradient(1px 1px at 43% 12%,#fff 99%,transparent); background-size:400px 400px; }
    .orb { position:fixed; width:340px; aspect-ratio:1; border-radius:50%; filter:blur(90px); opacity:.17; background:#a15cff; left:-170px; top:35%; }
    main { width:min(100%,760px); position:relative; text-align:center; padding:clamp(32px,8vw,76px) clamp(24px,7vw,68px); border:1px solid #ffffff20; border-radius:32px; background:linear-gradient(145deg,#ffffff0d,#ffffff04); box-shadow:0 28px 100px #0007,inset 0 1px #ffffff18; backdrop-filter:blur(18px); animation:arrive .9s cubic-bezier(.2,.8,.2,1) both; }
    .site-nav { position:fixed; z-index:2; top:22px; left:50%; transform:translateX(-50%); display:flex; gap:6px; padding:6px; border:1px solid #ffffff20; border-radius:99px; background:#0b1020a8; backdrop-filter:blur(14px); }
    .site-nav a { padding:9px 14px; color:#aaaac4; text-decoration:none; font-size:.86rem; border-radius:99px; transition:background .2s,color .2s; }
    .site-nav a:hover,.site-nav a[aria-current="page"] { color:#fff; background:#ffffff16; }
    @media(max-width:520px) { .site-nav { top:12px } main { margin-top:58px } footer { position:relative; bottom:auto; margin-top:24px; text-align:center } body { overflow:auto; align-content:center } }
    .eyebrow { display:inline-flex; align-items:center; gap:9px; color:#d9d5f3; border:1px solid #ffffff20; border-radius:99px; padding:8px 13px; font-size:.76rem; letter-spacing:.13em; text-transform:uppercase; }
    .dot { width:7px; height:7px; border-radius:50%; background:#7dffbd; box-shadow:0 0 14px #7dffbd; }
    h1 { margin:28px 0 14px; font-size:clamp(3.6rem,11vw,7.2rem); letter-spacing:-.075em; line-height:.95; font-weight:760; background:linear-gradient(105deg,#fff 14%,#c9c3ff 48%,#81e7ff 88%); color:transparent; background-clip:text; -webkit-background-clip:text; }
    p { max-width:470px; margin:0 auto; color:var(--muted); font-size:clamp(1rem,2.4vw,1.14rem); line-height:1.75; }
    .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:34px; }
    button { appearance:none; border:0; cursor:pointer; border-radius:13px; padding:13px 19px; font:600 .95rem inherit; font-family:inherit; font-size:.95rem; font-weight:650; transition:transform .2s,box-shadow .2s,background .2s; }
    button:hover { transform:translateY(-2px) }
    .primary { color:#111327; background:linear-gradient(110deg,#b9a8ff,#8eeaff); box-shadow:0 8px 28px #8edfff38; }
    .primary:hover { box-shadow:0 12px 34px #8edfff60 }
    .secondary { color:#e5e3f3; background:#ffffff0b; border:1px solid #ffffff21; }
    .secondary:hover { background:#ffffff14 }
    .note { min-height:1.4em; margin-top:23px; color:#b8b5d2; font-size:.85rem; }
    footer { position:fixed; bottom:22px; color:#777991; font-size:.75rem; letter-spacing:.04em; }
    @keyframes arrive { from { opacity:0; transform:translateY(18px) scale(.985) } to { opacity:1; transform:none } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; scroll-behavior:auto!important } }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="Main navigation"><a href="hello-world.html" aria-current="page">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav>
  <div class="stars" aria-hidden="true"></div><div class="orb" aria-hidden="true"></div>
  <main>
    <div class="eyebrow"><span class="dot" aria-hidden="true"></span> A fresh little beginning</div>
    <h1>Hello,<br>World.</h1>
    <p>One small page, one big internet. Here’s to curious ideas, happy accidents, and whatever you make next.</p>
    <div class="actions">
      <button class="primary" id="hello">Say hello <span aria-hidden="true">↗</span></button>
      <button class="secondary" id="copy">Copy greeting</button>
    </div>
    <div class="note" id="note" aria-live="polite"></div>
  </main>
  <footer>MADE WITH A LITTLE ✦ AND A LOT OF POSSIBILITY</footer>
  <script>
    const note = document.querySelector('#note');
    document.querySelector('#hello').addEventListener('click', () => {
      note.textContent = 'Hello right back at you. The web is better with you here. ✨';
    });
    document.querySelector('#copy').addEventListener('click', async (event) => {
      try {
        await navigator.clipboard.writeText('Hello, World!');
        note.textContent = '“Hello, World!” copied to your clipboard.';
      } catch {
        note.textContent = 'Hello, World! ✨';
      }
      event.currentTarget.blur();
    });
  </script>
</body>
</html>
